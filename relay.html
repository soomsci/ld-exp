<!doctype html><html><head><meta charset="utf-8"></head><body><script>
// This embedded page only carries student RPCs. Bluetooth runs in the top-level student page.
const channel=<?!= JSON.stringify(channel) ?>,studentOrigin='https://soomsci.github.io';
const allowed=new Set(['getConfig','submitGroup','loadGroup','submitReport']);
window.addEventListener('message',event=>{
  const m=event.data;
  if(event.origin!==studentOrigin||event.source!==window.top||m?.channel!==channel||m.type!=='ldexp-request'||!allowed.has(m.fn)||!Array.isArray(m.args)||typeof m.id!=='string')return;
  const reply=result=>event.source.postMessage({type:'ldexp-response',channel,id:m.id,...result},studentOrigin);
  try{google.script.run.withSuccessHandler(value=>reply({value})).withFailureHandler(error=>reply({error:String(error.message||error)}))[m.fn](...m.args);}
  catch(error){reply({error:String(error.message||error)});}
});
window.top.postMessage({type:'ldexp-ready',channel},studentOrigin);
</script></body></html>
